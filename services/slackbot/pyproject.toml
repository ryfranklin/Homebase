[project]
name = "homebase-slackbot"
version = "0.1.0"
description = "Homebase Slack bridge: a Socket Mode app that talks to the AgentCore agent runtime over InvokeAgentRuntime."
requires-python = ">=3.11"
dependencies = [
  "slack-bolt>=1.18",
  "boto3>=1.34",
]

[project.scripts]
homebase-slackbot = "homebase_slackbot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
