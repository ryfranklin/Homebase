[project]
name = "homebase-eval"
version = "0.2.0"
description = "Eval harness for Homebase: retrieval quality (hit rate, MRR, rerank lift) and multi-model generation benchmarks (quality, latency, cost, task success) over the Bedrock Converse API."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# boto3 is only needed for live evaluation against a deployed KB.
live = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
homebase-eval = "homebase_eval.cli:main"
homebase-eval-models = "homebase_eval.gen_cli:main"
homebase-eval-batch = "homebase_eval.batch_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
