[project]
name = "homebase-cli"
version = "0.1.0"
description = "Thin terminal chat client for the Homebase agent. Invokes the AgentCore runtime via the task role; no repo access, no long-lived credentials."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# boto3 is only needed to run live against the AgentCore runtime.
live = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
homebase-cli = "homebase_cli.chat:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
