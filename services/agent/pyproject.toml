[project]
name = "homebase-agent"
version = "0.1.0"
description = "Homebase AgentCore agent: Claude on Bedrock with cited retrieval, memory, and observability."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# boto3 is only needed to run live against Bedrock / a deployed KB. tzdata provides
# the IANA timezone database for zoneinfo (the slim base image ships none).
live = ["boto3>=1.34", "tzdata>=2024.1"]
dev = ["pytest>=8"]

[project.scripts]
homebase-agent-harness = "homebase_agent.harness:main"
homebase-agent-server = "homebase_agent.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the versioned system prompt as package data so it is installed alongside
# the code (found in the container's site-packages, not just the repo tree).
[tool.setuptools.package-data]
homebase_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
