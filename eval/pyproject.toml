[project]
name = "homebase-eval"
version = "0.1.0"
description = "Retrieval eval harness for the Homebase Bedrock Knowledge Base: hit rate, MRR, and rerank lift."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# boto3 is only needed for live evaluation against a deployed KB.
live = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
homebase-eval = "homebase_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
