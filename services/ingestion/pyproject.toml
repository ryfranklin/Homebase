[project]
name = "homebase-ingestion"
version = "0.1.0"
description = "Mirror a local Markdown corpus into the Homebase source S3 bucket, Markdown-aware."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
homebase-ingest = "homebase_ingestion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
