[project]
name = "homebase-connectors"
version = "0.1.0"
description = "Six live connectors as read-first, write-gated MCP tools for the Homebase agent."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["boto3>=1.34"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
