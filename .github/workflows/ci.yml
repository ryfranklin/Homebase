name: ci

# Continuous integration for Homebase. Scans, formatting, lint, tests, a build+verify
# of the agent image, plus a CONTENT-ONLY web deploy on push to main (S3 sync +
# CloudFront invalidation). Infrastructure (terraform apply) and the agent image are
# NEVER deployed here: the agent job only builds and verifies the image (no push, no
# apply); pushing it and applying stay human (see scripts/deploy-agent.sh and the
# RUNBOOK). The web deploy authenticates with GitHub OIDC (no long-lived keys) and is
# skipped until the deploy Secrets are configured (see infra/stacks/cicd).

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Authenticate the action's owner-type lookup so it is not rate-limited
          # (unauthenticated, it can fail and then wrongly demand an org license).
          # This does not change what is scanned; the full history is still scanned.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the job on any finding.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  terraform-fmt:
    name: terraform fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform fmt -check
        run: |
          if [ -d infra ] && find infra -name '*.tf' -print -quit | grep -q .; then
            terraform fmt -check -recursive infra
          else
            echo "No Terraform files yet; skipping fmt check."
          fi

  iac-security:
    name: iac security scan (checkov, gated on NEW findings vs baseline)
    runs-on: ubuntu-latest
    # Scans the Terraform for AWS misconfigurations. Offline, NO cloud credentials.
    # The repo's split-resource idiom (a bucket plus separate public-access-block /
    # versioning / encryption resources, often under count/for_each) and several
    # deliberately-accepted patterns (the intentionally-public SPA bucket on SSE-S3,
    # the architecturally-required AgentCore IAM wildcards) produce a large set of
    # known findings. Those are frozen in infra/.checkov.baseline, so this gate is
    # green today and fails only on NEW misconfigurations a change introduces (for
    # example a fresh 0.0.0.0/0 security group or an unencrypted new bucket).
    # To re-triage after intentionally changing infra, refresh the baseline:
    #   checkov -d infra --framework terraform --create-baseline --soft-fail
    # and commit infra/.checkov.baseline with the change.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a new Checkov release cannot turn an unrelated PR red by adding a
      # check that fires on already-committed infra; bump deliberately.
      - name: Install Checkov
        run: python -m pip install --upgrade pip "checkov==3.3.15"
      - name: Checkov (Terraform) — fail only on findings not in the baseline
        run: |
          if [ -d infra ] && find infra -name '*.tf' -print -quit | grep -q .; then
            checkov -d infra --framework terraform \
              --baseline infra/.checkov.baseline \
              --compact --quiet
          else
            echo "No Terraform files yet; skipping IaC scan."
          fi

  lint:
    name: language linters (where code exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint web and cli (if configured)
        run: |
          for dir in web cli; do
            if [ -f "$dir/package.json" ]; then
              echo "Linting $dir"
              (cd "$dir" && npm ci && npm run lint --if-present)
            else
              echo "No package.json in $dir; skipping."
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint Python (if configured)
        run: |
          if find services eval cli -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m pip install --upgrade pip ruff
            ruff check services eval cli || true
          else
            echo "No Python files yet; skipping."
          fi

  tests:
    name: unit tests (offline, no cloud credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python unit tests
        run: |
          for pkg in services/ingestion services/agent services/connectors services/slackbot cli eval; do
            if [ -d "$pkg/tests" ]; then
              echo "== $pkg =="
              (cd "$pkg" && python -m unittest discover -s tests)
            fi
          done
      - name: BFF unit tests
        run: |
          if [ -f services/bff/package.json ]; then (cd services/bff && node --test); fi

  eval-gate:
    name: retrieval eval gate (offline regression gate)
    runs-on: ubuntu-latest
    # This gate runs OFFLINE against committed synthetic fixtures with NO cloud
    # credentials. It guards regressions in the retrieval CODE, not absolute
    # quality on the real corpus (that is the separate live ADR-002 eval). See
    # docs/eval-gate.md. It must never be given AWS credentials or secrets.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the retrieval regression gate
        run: |
          cd eval
          PYTHONPATH=src python -m homebase_eval.cli --gate --k 3

  build-agent:
    name: build + verify agent image (arm64, no push)
    # Builds the PRODUCTION arm64 agent image and runs the same import + connector-
    # tool checks as scripts/deploy-agent.sh, WITHOUT pushing to ECR or applying.
    # No AWS credentials. Catches broken/stale images (missing package data, import
    # errors, dropped connector tools) before a human ever runs the deploy. Only the
    # emulated arm64 build is heavy, so it runs solely on PRs and pushes to main, and
    # only when services/agent changed. Layer cache keeps reruns quick.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect agent changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            agent:
              - 'services/agent/**'

      - name: Set up QEMU (arm64 emulation)
        if: steps.changes.outputs.agent == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.changes.outputs.agent == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build the production arm64 image (no push)
        if: steps.changes.outputs.agent == 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/agent
          platforms: linux/arm64
          load: true
          tags: homebase-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image imports + connector tools (mirrors deploy-agent.sh)
        if: steps.changes.outputs.agent == 'true'
        run: |
          docker run --rm --platform linux/arm64 --entrypoint python homebase-agent:ci -c '
          import homebase_agent.server  # import must succeed
          import homebase_agent.connectors as c
          tools = {t["toolSpec"]["name"] for t in c.CONNECTOR_TOOLS}
          assert tools, "no connector tools found in the image"
          assert "confluence_search" in tools, "confluence_search tool missing"
          print("verify OK:", len(tools), "connector tools:", ", ".join(sorted(tools)))
          '

  vault-worker:
    name: vault worker (typecheck + tests)
    # Typechecks and tests the git-vault worker (git ops + conflict policy + mirror).
    # Runs only when services/vault-worker changes. git is preinstalled on the runner,
    # which the GitVault tests need (they run against throwaway local repos).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect worker changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            worker:
              - 'services/vault-worker/**'
      - name: Set up Node
        if: steps.changes.outputs.worker == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, typecheck, test
        if: steps.changes.outputs.worker == 'true'
        working-directory: services/vault-worker
        run: |
          npm ci
          npm run typecheck
          npm test

  deploy-web:
    name: deploy web (S3 sync + CloudFront invalidation)
    # CONTENT deploy only. This never runs terraform apply and never touches the
    # agent image (both remain human actions). It runs only on a push to main,
    # after the checks pass. Auth is GitHub OIDC, so there are NO long-lived AWS
    # keys. Every account-specific value comes from repo Secrets (never a literal);
    # keeping them as Secrets also masks them in the public Actions logs. A first
    # step no-ops the job (stays green) until the deploy Secrets are configured.
    needs: [secret-scan, terraform-fmt, iac-security, lint, tests, eval-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC role assumption
    steps:
      - name: Check deploy is configured
        id: gate
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          BUCKET: ${{ secrets.WEB_BUCKET }}
        run: |
          if [ -n "$ROLE" ] && [ -n "$BUCKET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Deploy not configured (AWS_DEPLOY_ROLE_ARN / WEB_BUCKET absent); skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - name: Set up Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials (GitHub OIDC, no static keys)
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build the SPA
        if: steps.gate.outputs.ready == 'true'
        working-directory: web
        # Vite build-time config. These are public client identifiers (they ship in
        # the bundle anyway), injected from repo Secrets so nothing is hardcoded.
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_HOSTED_UI_DOMAIN: ${{ secrets.VITE_COGNITO_HOSTED_UI_DOMAIN }}
          VITE_COGNITO_SCOPES: ${{ secrets.VITE_COGNITO_SCOPES }}
          VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI }}
          VITE_LOGOUT_URI: ${{ secrets.VITE_LOGOUT_URI }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Optional chat model choices ("id|Label" pairs). Unset -> selector hidden.
          VITE_CHAT_MODELS: ${{ secrets.VITE_CHAT_MODELS }}
        run: |
          npm ci
          npm run build

      - name: Sync to S3 and invalidate CloudFront
        if: steps.gate.outputs.ready == 'true'
        env:
          WEB_BUCKET: ${{ secrets.WEB_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          # Hashed assets are immutable: cache them forever so the browser reuses them.
          # index.html must NEVER be stale-cached, or it references deleted chunk hashes
          # and lazy imports 404 -> the SPA fallback returns HTML -> "MIME text/html"
          # module errors. So upload assets first (long cache), then index.html no-cache.
          aws s3 sync web/dist "s3://$WEB_BUCKET/" --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://$WEB_BUCKET/index.html" \
            --cache-control "no-cache,must-revalidate" \
            --content-type "text/html"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Post-deploy canary (verify the live site serves)
        # Blocking smoke check: a published deploy that doesn't actually serve should
        # be red, not silently green. Hits the SPA root (VITE_REDIRECT_URI) and
        # asserts HTTP 200 + the app's root marker, retrying while the invalidation
        # propagates. The WAF default action is allow and a plain GET / trips no
        # managed rule; GitHub runners egress from US, so any geo allowlist that
        # includes US passes.
        if: steps.gate.outputs.ready == 'true'
        env:
          SITE_URL: ${{ secrets.VITE_REDIRECT_URI }}
        run: |
          # Trim any stray whitespace/newline from the secret (URLs have none), so a
          # secret-hygiene slip doesn't masquerade as a serving failure.
          SITE_URL="$(printf '%s' "$SITE_URL" | tr -d '[:space:]')"
          if [ -z "$SITE_URL" ]; then
            echo "VITE_REDIRECT_URI not set; skipping canary."
            exit 0
          fi
          echo "Canary: GET the SPA root (expect HTTP 200 + <div id=\"root\">)"
          code=000
          for i in $(seq 1 10); do
            code=$(curl -sS -m 15 -A "HomebaseCanary/1.0 (+github-actions)" \
              -o body.html -w '%{http_code}' "$SITE_URL" 2>/dev/null || true)
            [ -z "$code" ] && code=000
            if [ "$code" = "200" ] && grep -q 'id="root"' body.html; then
              echo "Canary OK on attempt $i (HTTP 200, SPA root marker present)."
              exit 0
            fi
            echo "attempt $i/10: HTTP $code; retrying in 6s..."
            sleep 6
          done
          echo "::error::Canary failed after 10 attempts (last HTTP $code). The deploy published but the live site did not return a valid SPA."
          exit 1
